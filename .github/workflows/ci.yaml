name: CI
on:
  pull_request:
permissions:
  contents: read
jobs:
  Lint-test-pass:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install development checks
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format g++
          python -m pip install -e '.[dev]'
      - name: Lint Checks
        run: ./scripts/lint.sh
      - name: Unit Tests
        run: ./scripts/test.sh
  validate-esphome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install pinned ESPHome
        run: python -m pip install esphome==2026.10.2
      - name: Validate configurations
        run: ./scripts/validate.sh
  build-esp32:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/platformio
          key: platformio-${{ runner.os }}-esphome-radio-bridge-2026.10.2
      - name: Install pinned ESPHome
        run: python -m pip install esphome==2026.10.2
      - name: Compile ESP32 firmware
        run: ./scripts/compile.sh
