# ESPHome component compile fixture (no secrets; safe for CI).
esphome:
  name: test-esphome-radio-bridge
  min_version: 2026.10.1

packages:
  hardware: !include ../../../packages/esp32-wrover-lan8720.yaml

external_components:
  - source:
      type: local
      path: ../../../components
    components: [esphome-radio-bridge]

logger:
  baud_rate: 0

http_request:
  verify_ssl: true
  follow_redirects: false

esphome-radio-bridge:
  catalogue_url: https://raw.githubusercontent.com/Astute4185/esphome-radio-firmware/main/catalogue.json
  manifest_override:
    name: Firmware Manifest Override URL
  catalogue_status:
    name: Firmware Catalogue Status
  refresh_catalogue:
    name: Refresh Firmware Catalogue
  driver: tubeszb_mgm210_poe_2023
  tcp_port: 6638
  bridge_ready:
    name: Radio Bridge Ready
  bridge_status:
    name: Radio Bridge Status
  last_disconnect_reason:
    name: TCP Last Disconnect Reason
  transport_errors:
    name: TCP Transport Errors
  connected:
    name: TCP Connected
  disconnects:
    name: TCP Disconnects
  installed_firmware:
    name: EFR32 Installed Firmware
  radio_identification_status:
    name: EFR32 Identification Status
  probe_radio:
    name: EFR32 Probe Firmware
  mode:
    name: Radio Mode
  flash_armed:
    name: Firmware Maintenance Armed
  radio_reset:
    name: Radio Reset
  enter_bootloader:
    name: Enter Bootloader
  exit_bootloader:
    name: Exit Bootloader
