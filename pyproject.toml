[project]
name = "serial-radio-gateway-development"
version = "0.3.0"
description = "Development and test tooling for the reusable ESPHome serial radio gateway and driver modules"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.13,<1",
  "PyYAML>=6,<7",
  "yamllint>=1.35,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 105
include = ["*.py", "pyproject.toml"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"components/serial_radio_gateway/__init__.py" = ["I001"]
"tests/python/test_flasher.py" = ["I001"]
