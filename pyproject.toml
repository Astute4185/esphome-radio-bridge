[project]
name = "esphome-radio-bridge-development"
version = "0.3.0"
description = "Development and test tooling for the ESPHome radio bridge and reusable radio drivers"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.13,<1",
  "PyYAML>=6,<7",
  "yamllint>=1.35,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 105
include = ["*.py", "pyproject.toml"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"components/esphome-radio-bridge/__init__.py" = ["I001"]
"tests/python/test_flasher.py" = ["I001"]

# Prevent setuptools from treating ESPHome directories as Python packages.
[tool.setuptools]
packages = []