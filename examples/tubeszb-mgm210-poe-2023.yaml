# Full version derived from the user's working ESPHome 2026.10.1 config.
# Driver selects 4-wire normal RTS/CTS and 2-wire Gecko bootloader UART.
# WARNING: MGM NCP image must support normal-mode RTS/CTS.
substitutions:
  deviceid: tubeszb-efr32-mgm210-poe-2023
  devicename: TubesZB Zigbee Coordinator
  log_lvl: WARN

esphome:
  name: ${deviceid}
  friendly_name: ${devicename}
  name_add_mac_suffix: false
  min_version: 2026.10.1

packages:
  board_network: !include ../packages/esp32-wrover-lan8720.yaml

external_components:
  - source:
      type: local
      path: ../components
    components: [esphome-radio-bridge]

logger:
  level: ${log_lvl}
  baud_rate: 0

api:
  encryption:
    key: !secret apikey_tubeszb
  reboot_timeout: 0s

ota:
  - platform: esphome
  - platform: web_server

web_server:
  port: 80
  version: 2
  auth:
    type: digest
    username: !secret web_server_username
    password: !secret web_server_password

http_request:
  verify_ssl: true
  follow_redirects: false

esphome-radio-bridge:
  catalogue_url: https://raw.githubusercontent.com/Astute4185/esphome-radio-firmware/main/catalogue.json
  manifest_override:
    name: Firmware Manifest Override URL
  catalogue_status:
    name: Firmware Catalogue Status
  refresh_catalogue:
    name: Refresh Firmware Catalogue
  check_updates:
    name: EFR32 Check for Updates
  latest_firmware:
    name: EFR32 Latest Firmware
  update_available:
    name: EFR32 Update Available
  id: zigbee_gateway
  driver: tubeszb_mgm210_poe_2023
  tcp_port: 6638
  maintenance_timeout: 10min
  bridge_ready:
    name: Radio Bridge Ready
  bridge_status:
    name: Radio Bridge Status
  last_disconnect_reason:
    name: TCP Last Disconnect Reason
  transport_errors:
    name: TCP Transport Errors
  connected:
    name: Zigbee TCP Client Connected
    id: zigbee_tcp_connected
  disconnects:
    name: Zigbee TCP Disconnects
  installed_firmware:
    name: EFR32 Installed Firmware
  radio_identification_status:
    name: EFR32 Identification Status
  probe_radio:
    name: EFR32 Probe Firmware
  mode:
    name: EFR32 Operating Mode
  flash_armed:
    name: EFR32 Firmware Flash Armed
  radio_reset:
    name: EFR32 Reset
  enter_bootloader:
    name: EFR32 Enter Bootloader
  exit_bootloader:
    name: EFR32 Exit Bootloader

button:
  - platform: restart
    name: ESP32 Restart
    entity_category: diagnostic

binary_sensor:
  - platform: status
    name: ESP32 Status
    entity_category: diagnostic

sensor:
  - platform: uptime
    name: Uptime
    entity_category: diagnostic
  - platform: internal_temperature
    name: ESP32 Temperature
    entity_category: diagnostic
    update_interval: 60s

text_sensor:
  - platform: ethernet_info
    ip_address:
      name: IP Address
      entity_category: diagnostic
  - platform: version
    name: ESPHome Version
    entity_category: diagnostic
