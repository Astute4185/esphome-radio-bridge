# Test example. MGM210 POC selects 2-wire normal and 2-wire bootloader UART.
esphome:
  name: tubeszb-mgm210-poe-2023
  min_version: 2026.10.1

packages:
  board_network: !include ../packages/esp32-wrover-lan8720.yaml
  # Radio flashing requires a dedicated partition. Add the staging package only
  # when installing the ESP32 partition table by serial/USB flashing.
  # flash_staging: !include ../packages/radio-flash-staging.yaml

external_components:
  - source:
      type: local
      path: ../components
    components: [esphome-radio-bridge]

logger:
  baud_rate: 0

api:
  encryption:
    key: !secret apikey_tubeszb

ota:
  - platform: esphome

http_request:
  verify_ssl: true
  follow_redirects: true

esphome-radio-bridge:
  # catalogue_url is optional: the selected driver supplies its default.
  manifest_override:
    name: Firmware Manifest Override URL
  catalogue_status:
    name: Firmware Catalogue Status
  refresh_catalogue:
    name: Refresh Firmware Catalogue
  check_updates:
    name: EFR32 Check for Updates
  latest_firmware:
    name: EFR32 Latest Firmware
  flash_firmware:
    name: EFR32 Update Firmware
  firmware_update_status:
    name: EFR32 Firmware Update Status
  update_available:
    name: EFR32 Update Available
  driver: tubeszb_mgm210_poe_2023
  tcp_port: 6638
  flash_armed:
    name: EFR32 Firmware Flash Armed
  radio_reset:
    name: EFR32 Reset
  enter_bootloader:
    name: EFR32 Enter Bootloader
  exit_bootloader:
    name: EFR32 Exit Bootloader
  bridge_ready:
    name: Radio Bridge Ready
  bridge_status:
    name: Radio Bridge Status
  connected:
    name: Zigbee TCP Client Connected
  installed_firmware:
    name: EFR32 Installed Firmware
  radio_identification_status:
    name: EFR32 Identification Status
  probe_radio:
    name: EFR32 Probe Firmware
  mode:
    name: EFR32 Operating Mode
